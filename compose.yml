name: ${REPLAYGUARD_PROJECT_NAME:?Set a unique stable project name}
services:
  postgres:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
  backend-api:
    image: ghcr.io/ravithejatech714-create/replayguard-community-backend-api@sha256:1f1db2410dd250a7ed63ba72338024bb17318dedd9761774e5b28d59472a1d30
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SERVER_PORT: 18080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/app/database/migrations
      REPLAYGUARD_JWT_SECRET: ${REPLAYGUARD_JWT_SECRET:?Required}
      REPLAYGUARD_PROFILE_ENCRYPTION_KEY: ${REPLAYGUARD_PROFILE_ENCRYPTION_KEY:?Required}
      REPLAYGUARD_ADMIN_USERNAME: ${REPLAYGUARD_ADMIN_USERNAME:?Required}
      REPLAYGUARD_ADMIN_EMAIL: ${REPLAYGUARD_ADMIN_EMAIL:?Required}
      REPLAYGUARD_ADMIN_PASSWORD: ${REPLAYGUARD_ADMIN_PASSWORD:?Required}
      REPLAYGUARD_ADMIN_DISPLAY_NAME: ${REPLAYGUARD_ADMIN_DISPLAY_NAME:?Required}
      REPLAYGUARD_LICENSE_KEY: ${REPLAYGUARD_LICENSE_KEY:-}
      REPLAYGUARD_AUTH_COOKIE_SECURE: 'false'
      REPLAYGUARD_AUTH_COOKIE_SAME_SITE: Strict
      REPLAYGUARD_CORS_ALLOWED_ORIGINS: http://localhost:${REPLAYGUARD_HTTP_PORT:-8080}
      REPLAYGUARD_WEBHOOKS_ENABLED: 'false'
      REPLAYGUARD_ALLOW_INSECURE_SASL_PLAINTEXT: 'false'
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_REPLAYGUARD: INFO
      LOGGING_LEVEL_KAFKA: WARN
    volumes:
      - ./kafka-secrets:/etc/replayguard/kafka:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://localhost:18080/actuator/health | grep -q UP']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  replay-worker:
    image: ghcr.io/ravithejatech714-create/replayguard-community-replay-worker@sha256:97b71bd550463933dc9cd1abf5ef4cd7fead7f25313cd3f98518a714f340080f
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SERVER_PORT: 18081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REPLAYGUARD_PROFILE_ENCRYPTION_KEY: ${REPLAYGUARD_PROFILE_ENCRYPTION_KEY:?Required}
      REPLAYGUARD_LICENSE_KEY: ${REPLAYGUARD_LICENSE_KEY:-}
      REPLAYGUARD_WORKER_ID: replay-worker-1
      REPLAYGUARD_ALLOW_INSECURE_SASL_PLAINTEXT: 'false'
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_REPLAYGUARD: INFO
      LOGGING_LEVEL_KAFKA: WARN
    volumes:
      - ./kafka-secrets:/etc/replayguard/kafka:ro
    depends_on:
      backend-api:
        condition: service_healthy
  frontend:
    image: ghcr.io/ravithejatech714-create/replayguard-community-frontend@sha256:8a8b62b4f1493373a1fb101986c4f065849c97ab76a7eecee46929e929eee95b
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
  reverse-proxy:
    image: ghcr.io/ravithejatech714-create/replayguard-community-reverse-proxy@sha256:06784f962a189b81f70619f8dc2ef9efa0e83dced754e0fad613b1635a6653fd
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REPLAYGUARD_HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-api:
        condition: service_healthy
      frontend:
        condition: service_started
volumes:
  postgres-data:
